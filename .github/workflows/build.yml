name: build

on:
  push:
  pull_request:

jobs:
  debian-trixie:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          xargs apt-get install -y --no-install-recommends < scripts/ci/debian-trixie-build-packages.txt
      - name: Verify native x86-64 environment
        run: test "$(dpkg --print-architecture)" = amd64
      - name: Validate build-platform contract
        run: python3 -B tests/platform/validate_build_platforms.py --source-root "$GITHUB_WORKSPACE" --self-test-tamper
      - name: Build and test debug configuration
        run: sh scripts/ci/run-meson-build.sh build enabled debug

  debian-trixie-configurations:
    name: Debian Trixie ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 release
            runner: ubuntu-24.04
            architecture: amd64
            profile: release
          - name: x86-64 AddressSanitizer
            runner: ubuntu-24.04
            architecture: amd64
            profile: asan
          - name: x86-64 UndefinedBehaviorSanitizer
            runner: ubuntu-24.04
            architecture: amd64
            profile: ubsan
          - name: ARM64 debug
            runner: ubuntu-24.04-arm
            architecture: arm64
            profile: debug
          - name: ARM64 release
            runner: ubuntu-24.04-arm
            architecture: arm64
            profile: release
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian Trixie dependencies
        run: |
          apt-get update
          xargs apt-get install -y --no-install-recommends < scripts/ci/debian-trixie-build-packages.txt
      - name: Verify native architecture
        run: test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
      - name: Install libFuzzer toolchain
        if: matrix.profile == 'asan'
        run: apt-get install -y --no-install-recommends clang libclang-rt-dev
      - name: Build and test
        run: sh scripts/ci/run-meson-build.sh "build-${{ matrix.profile }}" enabled "${{ matrix.profile }}"
      - name: Run sustained configuration fuzzer
        if: matrix.profile == 'asan'
        run: sh tests/fuzz/run_config_fuzzer.sh "$GITHUB_WORKSPACE" /tmp/wtwm-config-fuzz 100000

  host-native-portable:
    name: Host-native portable (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            architecture: arm64
          - name: macOS x86-64
            runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install portable build dependencies
        run: brew install meson ninja
      - name: Verify native host architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Validate build-platform contract
        run: python3 -B tests/platform/validate_build_platforms.py --source-root "$GITHUB_WORKSPACE" --self-test-tamper
      - name: Build and test platform-independent code
        run: sh scripts/ci/run-meson-build.sh build-host disabled debug

  reference-twm:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled X11 build environment
        run: |
          apt-get update
          xargs apt-get install -y --no-install-recommends < reference/environment/debian-trixie-x11-packages.txt
      - name: Record resolved package versions
        run: |
          xargs dpkg-query -W -f='${binary:Package}\t${Version}\n' < reference/environment/debian-trixie-x11-packages.txt
      - name: Build and smoke-test reference twm
        run: sh tests/reference/build_reference_twm.sh "$GITHUB_WORKSPACE" /tmp/reference-build
      - name: Capture repeatable reference behavior
        run: sh tests/reference/capture_reference_twm.sh "$GITHUB_WORKSPACE" /tmp/reference-build /tmp/reference-capture "$GITHUB_WORKSPACE/reference/captures/twm-1.0.13.1/baseline"
      - name: Capture repeatable reference geometry matrix
        run: sh tests/reference/capture_reference_geometry_matrix.sh "$GITHUB_WORKSPACE" /tmp/reference-build /tmp/reference-geometry-matrix
      - name: Verify canonical X11 applications
        run: sh tests/reference/verify_canonical_x11_apps.sh "$GITHUB_WORKSPACE" /tmp/reference-build
      - name: Build portable configuration checker
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude src/config.c src/placement.c src/config_check.c \
            -o /tmp/wtwm-config
      - name: Compare the complete parser with reference twm
        run: sh tests/reference/run_reference_parser_comparison.sh "$GITHUB_WORKSPACE" /tmp/wtwm-config /tmp/wtwm-parser-comparison.json
      - name: Upload parser differential
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-differential
          path: /tmp/wtwm-parser-comparison.json
          if-no-files-found: error
      - name: Upload reference capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-capture
          path: /tmp/reference-capture
          if-no-files-found: error
      - name: Upload reference geometry matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-geometry-matrix
          path: /tmp/reference-geometry-matrix
          if-no-files-found: error

  x11-differential:
    name: Reference twm / wtwm X11 differential
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen reference and compositor dependencies
        run: |
          apt-get update
          {
            cat scripts/ci/debian-trixie-build-packages.txt
            cat reference/environment/debian-trixie-x11-packages.txt
            printf '%s\n' libxtst-dev
          } | sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' | sort -u |
            xargs apt-get install -y --no-install-recommends
      - name: Validate X11 differential contract
        run: python3 -B tests/integration/validate_x11_differential.py --source-root "$GITHUB_WORKSPACE" --self-test-tamper
      - name: Build frozen twm 1.0.13.1
        run: sh tests/reference/build_reference_twm.sh "$GITHUB_WORKSPACE" /tmp/reference-build
      - name: Build wtwm and shared X11 clients
        run: |
          meson setup build-differential -Dcompositor=enabled -Dwerror=true --buildtype=debug
          meson compile -C build-differential
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            $(pkg-config --cflags x11) tests/integration/x11_differential_probe.c \
            -o /tmp/x11-differential-probe $(pkg-config --libs x11)
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            $(pkg-config --cflags x11) tests/integration/m4_trace_client.c \
            -o /tmp/m4-trace-client $(pkg-config --libs x11)
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            $(pkg-config --cflags x11) tests/integration/m4_trace_probe.c \
            -o /tmp/m4-trace-probe $(pkg-config --libs x11)
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            $(pkg-config --cflags x11 xtst) tests/integration/m4_trace_input.c \
            -o /tmp/m4-trace-input $(pkg-config --libs x11 xtst)
      - name: Compare identical canonical clients live
        run: |
          python3 -B tests/integration/run_x11_differential.py \
            --reference-twm /tmp/reference-build/twm \
            --compositor "$GITHUB_WORKSPACE/build-differential/wtwm-test-compositor" \
            --icccm-client "$GITHUB_WORKSPACE/build-differential/wtwm-xwayland-bridge-client" \
            --probe /tmp/x11-differential-probe \
            --scenario "$GITHUB_WORKSPACE/tests/integration/x11_differential.twmrc" \
            --output /tmp/x11-differential.json \
            --xterm /usr/bin/xterm --xclock /usr/bin/xclock \
            --xload /usr/bin/xload --emacs /usr/bin/emacs \
            --dialog /usr/bin/dialog
      - name: Compare identical Milestone 4 event traces live
        run: |
          python3 -B tests/integration/run_m4_trace_differential.py \
            --reference-twm /tmp/reference-build/twm \
            --compositor "$GITHUB_WORKSPACE/build-differential/wtwm-test-compositor" \
            --client /tmp/m4-trace-client \
            --probe /tmp/m4-trace-probe \
            --input-driver /tmp/m4-trace-input \
            --config "$GITHUB_WORKSPACE/tests/integration/m4_trace_differential.twmrc" \
            --contract "$GITHUB_WORKSPACE/reference/interactions/twm-1.0.13.1/trace-differential.json" \
            --oracle "$GITHUB_WORKSPACE/reference/captures/twm-1.0.13.1/baseline/phase-alpha.json" \
            --output /tmp/m4-trace-differential.json
      - name: Upload normalized X11 differential
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x11-differential
          path: |
            /tmp/x11-differential.json
            /tmp/x11-differential-evidence
          if-no-files-found: error
      - name: Upload Milestone 4 event trace differential
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-trace-differential
          path: |
            /tmp/m4-trace-differential.json
            /tmp/m4-trace-differential-evidence
          if-no-files-found: error
