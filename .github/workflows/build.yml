name: build

on:
  push:
  pull_request:

jobs:
  debian-trixie:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          xargs apt-get install -y --no-install-recommends < scripts/ci/debian-trixie-build-packages.txt
      - name: Verify native x86-64 environment
        run: test "$(dpkg --print-architecture)" = amd64
      - name: Validate build-platform contract
        run: python3 -B tests/platform/validate_build_platforms.py --source-root "$GITHUB_WORKSPACE" --self-test-tamper
      - name: Build and test debug configuration
        run: sh scripts/ci/run-meson-build.sh build enabled debug

  debian-trixie-configurations:
    name: Debian Trixie ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 release
            runner: ubuntu-24.04
            architecture: amd64
            profile: release
          - name: x86-64 AddressSanitizer
            runner: ubuntu-24.04
            architecture: amd64
            profile: asan
          - name: x86-64 UndefinedBehaviorSanitizer
            runner: ubuntu-24.04
            architecture: amd64
            profile: ubsan
          - name: ARM64 debug
            runner: ubuntu-24.04-arm
            architecture: arm64
            profile: debug
          - name: ARM64 release
            runner: ubuntu-24.04-arm
            architecture: arm64
            profile: release
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian Trixie dependencies
        run: |
          apt-get update
          xargs apt-get install -y --no-install-recommends < scripts/ci/debian-trixie-build-packages.txt
      - name: Verify native architecture
        run: test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
      - name: Build and test
        run: sh scripts/ci/run-meson-build.sh "build-${{ matrix.profile }}" enabled "${{ matrix.profile }}"

  host-native-portable:
    name: Host-native portable (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            architecture: arm64
          - name: macOS x86-64
            runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install portable build dependencies
        run: brew install meson ninja
      - name: Verify native host architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Validate build-platform contract
        run: python3 -B tests/platform/validate_build_platforms.py --source-root "$GITHUB_WORKSPACE" --self-test-tamper
      - name: Build and test platform-independent code
        run: sh scripts/ci/run-meson-build.sh build-host disabled debug

  reference-twm:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install controlled X11 build environment
        run: |
          apt-get update
          xargs apt-get install -y --no-install-recommends < reference/environment/debian-trixie-x11-packages.txt
      - name: Record resolved package versions
        run: |
          xargs dpkg-query -W -f='${binary:Package}\t${Version}\n' < reference/environment/debian-trixie-x11-packages.txt
      - name: Build and smoke-test reference twm
        run: sh tests/reference/build_reference_twm.sh "$GITHUB_WORKSPACE" /tmp/reference-build
      - name: Capture repeatable reference behavior
        run: sh tests/reference/capture_reference_twm.sh "$GITHUB_WORKSPACE" /tmp/reference-build /tmp/reference-capture "$GITHUB_WORKSPACE/reference/captures/twm-1.0.13.1/baseline"
      - name: Verify canonical X11 applications
        run: sh tests/reference/verify_canonical_x11_apps.sh "$GITHUB_WORKSPACE" /tmp/reference-build
      - name: Upload reference capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-capture
          path: /tmp/reference-capture
          if-no-files-found: error
