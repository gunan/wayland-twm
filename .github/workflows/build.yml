name: build

on:
  push:
  pull_request:

jobs:
  debian-trixie:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential meson ninja-build pkgconf libwlroots-0.18-dev libwayland-dev libxkbcommon-dev libpango1.0-dev wayland-protocols
      - name: Configure
        run: meson setup build -Dcompositor=enabled -Dwerror=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
